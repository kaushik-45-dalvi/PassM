<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filter for clean hard neo-brutalist shadow -->
    <filter id="neoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="14" dy="14" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Hard Offset Drop Shadow for Shield -->
  <path
    d="M 256,40 C 370,40 435,78 435,185 C 435,320 320,410 256,472 C 192,410 77,320 77,185 C 77,78 142,40 256,40 Z"
    fill="#000000"
    transform="translate(14, 14)"
  />

  <!-- Main Mint Shield Body with Crisp Black Border -->
  <path
    d="M 256,40 C 370,40 435,78 435,185 C 435,320 320,410 256,472 C 192,410 77,320 77,185 C 77,78 142,40 256,40 Z"
    fill="#B5F2B7"
    stroke="#000000"
    stroke-width="26"
    stroke-linejoin="round"
  />

  <!-- Inner Vault Padlock Shackle -->
  <path
    d="M 188,240 L 188,185 C 188,145 218,115 256,115 C 294,115 324,145 324,185 L 324,240"
    fill="none"
    stroke="#000000"
    stroke-width="32"
    stroke-linecap="round"
  />

  <!-- Padlock Base Body with Shadow -->
  <rect
    x="152"
    y="235"
    width="208"
    height="155"
    rx="32"
    fill="#FFFFFF"
    stroke="#000000"
    stroke-width="26"
    stroke-linejoin="round"
  />

  <!-- Keyhole in Center -->
  <circle cx="256" cy="295" r="22" fill="#000000" />
  <polygon points="244,302 268,302 274,345 238,345" fill="#000000" />

  <!-- Subtle Accent Sparkle / Lock Bolt in Mint -->
  <circle cx="256" cy="295" r="7" fill="#B5F2B7" />
</svg>
